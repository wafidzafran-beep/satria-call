<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW CALL - Penerima</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: auto;
      padding: 25px 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      margin: 15px 0;
    }

    #callBox {
      display: none;
    }

    video {
      width: 100%;
      background: #222;
      border-radius: 16px;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #16a34a;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📞 AVEDOW CALL</h1>

  <div id="status">
    Menghubungkan...
  </div>

  <div id="callBox">

    <p>📞 <b>PANGGILAN MASUK!</b></p>

    <button onclick="terimaPanggilan()">
      TERIMA PANGGILAN
    </button>

  </div>

  <video id="remoteVideo" autoplay playsinline></video>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    onSnapshot,
    doc,
    updateDoc,
    arrayUnion
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyDD0xBU25FCgEBs7eEtJhbCs_u8iSPISQw",

    authDomain: "avedow-call.firebaseapp.com",

    projectId: "avedow-call",

    storageBucket: "avedow-call.firebasestorage.app",

    messagingSenderId: "520287803907",

    appId: "1:520287803907:web:ecaa9a6b6ebf72e7d14c36",

    measurementId: "G-YJKPCCSL4G"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  let panggilanAktif = null;

  let peerConnection = null;

  let localStream = null;


  const servers = {

    iceServers: [

      {
        urls: "stun:stun.l.google.com:19302"
      }

    ]

  };


  try {

    await signInAnonymously(auth);

    document.getElementById("status").textContent =
      "✅ Menunggu panggilan...";


    const q = query(
      collection(db, "calls"),
      where("status", "==", "menunggu")
    );


    onSnapshot(q, (snapshot) => {

  if (snapshot.empty) return;

  const docs = snapshot.docs;

  const calon = docs[docs.length - 1];
  const data = calon.data();

  // Jangan tampilkan panggilan sebelum offer tersedia
  if (!data.offer) {
    document.getElementById("status").textContent =
      "📞 Menyiapkan panggilan...";
    return;
  }

  panggilanAktif = calon;

  document.getElementById("status").textContent =
    "📞 PANGGILAN MASUK!";

  document.getElementById("callBox").style.display =
    "block";

});

    });


  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "❌ " + error.message;

  }


  window.terimaPanggilan = async function() {

    if (!panggilanAktif) return;


    try {

      document.getElementById("callBox").style.display =
        "none";

      document.getElementById("status").textContent =
        "🎥 Menghubungkan...";


      const callId = panggilanAktif.id;

      const callRef = doc(
        db,
        "calls",
        callId
      );


      peerConnection =
        new RTCPeerConnection(servers);


      peerConnection.ontrack = (event) => {

        if (event.streams && event.streams[0]) {

          document.getElementById("remoteVideo").srcObject =
            event.streams[0];

        }

      };


      peerConnection.onicecandidate =
        async (event) => {

          if (event.candidate) {

            await updateDoc(
              callRef,
              {

                receiverCandidates:
                  arrayUnion(
                    event.candidate.toJSON()
                  )

              }
            );

          }

        };


      const callData =
        panggilanAktif.data();


      await peerConnection.setRemoteDescription(

        new RTCSessionDescription(
          callData.offer
        )

      );


      const answer =
        await peerConnection.createAnswer();


      await peerConnection.setLocalDescription(
        answer
      );


      await updateDoc(
        callRef,
        {

          answer: {

            type: answer.type,

            sdp: answer.sdp

          },

          status: "terhubung"

        }

      );


      onSnapshot(
        callRef,
        async (snapshot) => {

          const data = snapshot.data();

          if (!data) return;


          if (data.callerCandidates) {

            for (
              const candidate
              of data.callerCandidates
            ) {

              try {

                await peerConnection.addIceCandidate(

                  new RTCIceCandidate(
                    candidate
                  )

                );

              } catch (e) {

                console.log(e);

              }

            }

          }

        }
      );


      document.getElementById("status").textContent =
        "🎥 Terhubung!";

    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "❌ " + error.message;

    }

  };

</script>

</body>
</html>
