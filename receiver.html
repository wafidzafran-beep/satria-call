<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW CALL - Penerima</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
    }

    #status {
      margin: 20px 0;
      font-size: 18px;
    }

    #incoming {
      display: none;
      background: #222;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 30px;
      font-size: 18px;
      margin: 8px;
      cursor: pointer;
    }

    #terima {
      background: #16c784;
      color: white;
    }

    #tolak {
      background: #e53935;
      color: white;
    }

    video {
      width: 100%;
      max-width: 480px;
      background: black;
      border-radius: 15px;
      margin-top: 15px;
    }

    .label {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>AVEDOW CALL</h1>

  <div id="status">🔄 Menunggu panggilan...</div>

  <div id="incoming">
    <h2>📞 PANGGILAN MASUK!</h2>
    <p>Seseorang sedang memanggil Anda.</p>

    <button id="terima">TERIMA</button>
    <button id="tolak">TOLAK</button>
  </div>

  <div id="callArea" style="display:none;">

    <div class="label">📹 Video penelepon</div>
    <video id="remoteVideo" autoplay playsinline></video>

    <div class="label">🎥 Video Anda</div>
    <video id="localVideo" autoplay muted playsinline></video>

  </div>

</div>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    arrayUnion
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // ==============================
  // FIREBASE
  // ==============================

  const firebaseConfig = {
    apiKey: "AIzaSyDD0xBU25FCgEBs7eEtJhbCs_u8iSPISQw",
    authDomain: "avedow-call.firebaseapp.com",
    projectId: "avedow-call",
    storageBucket: "avedow-call.firebasestorage.app",
    messagingSenderId: "520287803907",
    appId: "1:520287803907:web:ecaa9a6b6ebf72e7d14c36",
    measurementId: "G-YJKPCCSL4G"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  // ==============================
  // ELEMENT
  // ==============================

  const statusText = document.getElementById("status");

  const incomingBox = document.getElementById("incoming");

  const terimaButton = document.getElementById("terima");

  const tolakButton = document.getElementById("tolak");

  const callArea = document.getElementById("callArea");

  const remoteVideo = document.getElementById("remoteVideo");

  const localVideo = document.getElementById("localVideo");


  // ==============================
  // WEBRTC
  // ==============================

  let peerConnection = null;

  let localStream = null;

  let activeCall = null;

  let activeCallData = null;

  let remoteDescriptionSet = false;

  const receivedCallerCandidates = new Set();


  const rtcConfig = {

    iceServers: [

      {
        urls: "stun:stun.l.google.com:19302"
      },

      {
        urls: "stun:stun1.l.google.com:19302"
      }

    ]

  };


  // ==============================
  // LOGIN ANONYMOUS
  // ==============================

  try {

    await signInAnonymously(auth);

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "❌ Gagal terhubung ke Firebase";

  }


  onAuthStateChanged(auth, (user) => {

    if (user) {

      console.log("Penerima login:", user.uid);

      mulaiMencariPanggilan();

    }

  });


  // ==============================
  // CARI PANGGILAN
  // ==============================

  function mulaiMencariPanggilan() {

    const callsRef = collection(db, "calls");


    onSnapshot(callsRef, (snapshot) => {

      let calonCall = null;

      let waktuTerbaru = 0;


      snapshot.forEach((item) => {

        const data = item.data();


        // HARUS MENUNGGU OFFER YANG VALID

        if (
          data.status === "menunggu" &&
          data.offer &&
          data.offer.type &&
          data.offer.sdp
        ) {

          const waktu =
            Number(data.createdAtMs || 0);


          if (waktu >= waktuTerbaru) {

            waktuTerbaru = waktu;

            calonCall = item;

          }

        }

      });


      if (calonCall) {

        activeCall = calonCall;

        activeCallData = calonCall.data();


        statusText.textContent =
          "📞 Panggilan masuk!";


        incomingBox.style.display = "block";

      }

    });

  }


  // ==============================
  // TERIMA PANGGILAN
  // ==============================

  terimaButton.addEventListener("click", async () => {

    if (!activeCall) {

      statusText.textContent =
        "❌ Panggilan tidak ditemukan.";

      return;

    }


    terimaButton.disabled = true;

    tolakButton.disabled = true;


    statusText.textContent =
      "🔄 Menghubungkan...";


    try {

      // ==========================
      // AKTIFKAN KAMERA + MIC
      // ==========================

      localStream =
        await navigator.mediaDevices.getUserMedia({

          video: true,

          audio: true

        });


      localVideo.srcObject = localStream;


      // ==========================
      // PEER CONNECTION
      // ==========================

      peerConnection =
        new RTCPeerConnection(rtcConfig);


      // ==========================
      // MASUKKAN VIDEO + AUDIO
      // ==========================

      localStream.getTracks().forEach((track) => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });


      // ==========================
      // TERIMA VIDEO DARI PENELEPON
      // ==========================

      peerConnection.ontrack = (event) => {

        console.log(
          "Video/audio penelepon diterima"
        );


        if (event.streams && event.streams[0]) {

          remoteVideo.srcObject =
            event.streams[0];

          callArea.style.display =
            "block";

          statusText.textContent =
            "🟢 Terhubung!";

        }

      };


      // ==========================
      // ICE CANDIDATE PENERIMA
      // ==========================

      peerConnection.onicecandidate =
        async (event) => {

          if (
            event.candidate &&
            activeCall
          ) {

            try {

              await updateDoc(
                doc(
                  db,
                  "calls",
                  activeCall.id
                ),
                {

                  receiverCandidates:
                    arrayUnion(
                      event.candidate.toJSON()
                    )

                }
              );

            } catch (error) {

              console.error(
                "Gagal kirim ICE:",
                error
              );

            }

          }

        };


      // ==========================
      // OFFER DARI PENELEPON
      // ==========================

      const offer =
        activeCallData.offer;


      if (
        !offer ||
        !offer.type ||
        !offer.sdp
      ) {

        throw new Error(
          "Offer penelepon tidak tersedia."
        );

      }


      await peerConnection.setRemoteDescription(

        new RTCSessionDescription(offer)

      );


      remoteDescriptionSet = true;


      // ==========================
      // BUAT ANSWER
      // ==========================

      const answer =
        await peerConnection.createAnswer();


      await peerConnection.setLocalDescription(
        answer
      );


      // ==========================
      // KIRIM ANSWER KE PENELEPON
      // ==========================

      await updateDoc(

        doc(
          db,
          "calls",
          activeCall.id
        ),

        {

          answer: {

            type: answer.type,

            sdp: answer.sdp

          },

          status: "terhubung"

        }

      );


      // ==========================
      // AMBIL ICE DARI PENELEPON
      // ==========================

      const unsubscribe =
        onSnapshot(

          doc(
            db,
            "calls",
            activeCall.id
          ),

          async (snapshot) => {

            if (!snapshot.exists()) {
              return;
            }


            const data =
              snapshot.data();


            const candidates =
              data.callerCandidates || [];


            for (
              const candidateData
              of candidates
            ) {

              try {

                const candidateKey =
                  JSON.stringify(
                    candidateData
                  );


                if (
                  receivedCallerCandidates.has(
                    candidateKey
                  )
                ) {

                  continue;

                }


                receivedCallerCandidates.add(
                  candidateKey
                );


                if (
                  peerConnection &&
                  remoteDescriptionSet
                ) {

                  await peerConnection.addIceCandidate(

                    new RTCIceCandidate(
                      candidateData
                    )

                  );

                }

              } catch (error) {

                console.error(
                  "Gagal menambahkan ICE:",
                  error
                );

              }

            }

          }

        );


      incomingBox.style.display =
        "none";


      statusText.textContent =
        "🔄 Menghubungkan...";


      console.log(
        "Answer berhasil dikirim."
      );


    } catch (error) {

      console.error(
        "ERROR SAAT TERIMA:",
        error
      );


      statusText.textContent =
        "❌ Gagal menghubungkan: " +
        error.message;


      terimaButton.disabled = false;

      tolakButton.disabled = false;

    }

  });


  // ==============================
  // TOLAK
  // ==============================

  tolakButton.addEventListener("click", async () => {

    if (!activeCall) {
      return;
    }


    try {

      await updateDoc(

        doc(
          db,
          "calls",
          activeCall.id
        ),

        {

          status: "ditolak"

        }

      );


      incomingBox.style.display =
        "none";


      statusText.textContent =
        "📵 Panggilan ditolak.";


      activeCall = null;

      activeCallData = null;


    } catch (error) {

      console.error(error);

    }

  });

</script>

</body>
</html>
