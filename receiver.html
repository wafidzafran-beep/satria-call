<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW CALL - Penerima</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin: 10px 0 20px;
    }

    #status {
      margin: 15px 0;
    }

    #callBox {
      display: none;
    }

    video {
      width: 100%;
      max-height: 60vh;
      background: #222;
      border-radius: 16px;
      object-fit: cover;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #16a34a;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📞 AVEDOW CALL</h1>

  <div id="status">
    Menghubungkan...
  </div>

  <div id="callBox">

    <p>📞 <b>PANGGILAN MASUK!</b></p>

    <button onclick="terimaPanggilan()">
      TERIMA PANGGILAN
    </button>

  </div>

  <video id="localVideo" autoplay playsinline muted></video>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import { getAuth, signInAnonymously }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyDD0xBU25FCgEBs7eEtJhbCs_u8iSPISQw",

    authDomain: "avedow-call.firebaseapp.com",

    projectId: "avedow-call",

    storageBucket: "avedow-call.firebasestorage.app",

    messagingSenderId: "520287803907",

    appId: "1:520287803907:web:ecaa9a6b6ebf72e7d14c36",

    measurementId: "G-YJKPCCSL4G"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  let panggilanAktif = null;


  try {

    await signInAnonymously(auth);

    document.getElementById("status").textContent =
      "✅ Menunggu panggilan...";


    const callsRef = collection(db, "calls");


    onSnapshot(callsRef, (snapshot) => {

      let ditemukan = false;


      snapshot.forEach((doc) => {

        const data = doc.data();


        if (data.status === "menunggu") {

          panggilanAktif = doc;

          ditemukan = true;

        }

      });


      if (ditemukan) {

        document.getElementById("status").textContent =
          "📞 PANGGILAN MASUK!";

        document.getElementById("callBox").style.display =
          "block";

      }

    });


  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "❌ " + error.message;

  }


  window.terimaPanggilan = async function() {

    try {

      document.getElementById("status").textContent =
        "🎥 Meminta akses kamera dan mikrofon...";


      const stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });


      document.getElementById("localVideo").srcObject = stream;

      document.getElementById("status").textContent =
        "✅ Kamera dan mikrofon aktif";


    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "❌ Izin kamera/mikrofon ditolak";

    }

  };

</script>

</body>
</html>
