<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW CALL</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: auto;
      padding: 25px 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      margin: 15px 0;
    }

    video {
      width: 100%;
      background: #222;
      border-radius: 16px;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #16a34a;
      color: white;
    }

    #videoBox {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📞 AVEDOW CALL</h1>

  <div id="status">
    Siap melakukan panggilan
  </div>

  <button id="callButton" onclick="mulaiPanggilan()">
    📞 PANGGIL
  </button>

  <div id="videoBox">
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import { getAuth, signInAnonymously }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    doc,
    onSnapshot,
    serverTimestamp,
    arrayUnion
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyDD0xBU25FCgEBs7eEtJhbCs_u8iSPISQw",

    authDomain: "avedow-call.firebaseapp.com",

    projectId: "avedow-call",

    storageBucket: "avedow-call.firebasestorage.app",

    messagingSenderId: "520287803907",

    appId: "1:520287803907:web:ecaa9a6b6ebf72e7d14c36",

    measurementId: "G-YJKPCCSL4G"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  let user;

  let localStream;

  let peerConnection;

  let callDoc;


  const servers = {

    iceServers: [

      {
        urls: "stun:stun.l.google.com:19302"
      }

    ]

  };


  try {

    const result = await signInAnonymously(auth);

    user = result.user;

    document.getElementById("status").textContent =
      "✅ Siap melakukan panggilan";

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "❌ " + error.message;

  }


  window.mulaiPanggilan = async function() {

    try {

      document.getElementById("callButton").disabled = true;

      document.getElementById("status").textContent =
        "🎥 Meminta kamera dan mikrofon...";


      localStream =
        await navigator.mediaDevices.getUserMedia({

          video: true,

          audio: true

        });


      document.getElementById("localVideo").srcObject =
        localStream;

      document.getElementById("videoBox").style.display =
        "block";


      peerConnection =
        new RTCPeerConnection(servers);


      localStream.getTracks().forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });


      callDoc = await addDoc(
        collection(db, "calls"),
        {

          callerId: user.uid,

          status: "menunggu",

          waktu: serverTimestamp(),

          offer: null,

          answer: null,

          callerCandidates: [],

          receiverCandidates: []

        }
      );


      const callRef = doc(
        db,
        "calls",
        callDoc.id
      );


      peerConnection.onicecandidate =
        async (event) => {

          if (event.candidate) {

            await updateDoc(
              callRef,
              {

                callerCandidates:
                  arrayUnion(
                    event.candidate.toJSON()
                  )

              }
            );

          }

        };


      const offer =
        await peerConnection.createOffer();


      await peerConnection.setLocalDescription(
        offer
      );


      await updateDoc(
        callRef,
        {

          offer: {

            type: offer.type,

            sdp: offer.sdp

          }

        }
      );


      document.getElementById("status").textContent =
        "📞 Menunggu penerima menerima panggilan...";


      onSnapshot(
        callRef,
        async (snapshot) => {

          const data = snapshot.data();

          if (!data) return;


          if (
            data.answer &&
            !peerConnection.currentRemoteDescription
          ) {

            await peerConnection.setRemoteDescription(

              new RTCSessionDescription(
                data.answer
              )

            );

            document.getElementById("status").textContent =
              "🎥 Terhubung dengan penerima!";

          }


          if (data.receiverCandidates) {

            for (
              const candidate
              of data.receiverCandidates
            ) {

              try {

                await peerConnection.addIceCandidate(

                  new RTCIceCandidate(
                    candidate
                  )

                );

              } catch (e) {

                console.log(e);

              }

            }

          }

        }
      );


    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "❌ " + error.message;

      document.getElementById("callButton").disabled =
        false;

    }

  };

</script>

</body>
</html>
