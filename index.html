<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW CALL</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 25px;
    }

    #status {
      margin: 20px 0;
      font-size: 18px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px 35px;
      font-size: 20px;
      cursor: pointer;
      background: #16c784;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    video {
      width: 100%;
      max-width: 480px;
      background: black;
      border-radius: 15px;
      margin-top: 20px;
    }

    .label {
      margin-top: 15px;
      color: #aaa;
    }

    #videoArea {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>AVEDOW CALL</h1>

  <div id="status">
    🟢 Siap melakukan panggilan
  </div>

  <button id="panggil">
    📞 PANGGIL
  </button>

  <div id="videoArea">

    <div class="label">
      🎥 Kamera Anda
    </div>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <div class="label">
      📹 Video Penerima
    </div>

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

  </div>

</div>


<script type="module">

  // ==========================================
  // FIREBASE
  // ==========================================

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    doc,
    onSnapshot,
    updateDoc,
    arrayUnion,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyDD0xBU25FCgEBs7eEtJhbCs_u8iSPISQw",

    authDomain:
      "avedow-call.firebaseapp.com",

    projectId:
      "avedow-call",

    storageBucket:
      "avedow-call.firebasestorage.app",

    messagingSenderId:
      "520287803907",

    appId:
      "1:520287803907:web:ecaa9a6b6ebf72e7d14c36",

    measurementId:
      "G-YJKPCCSL4G"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  // ==========================================
  // ELEMENT
  // ==========================================

  const panggilButton =
    document.getElementById("panggil");

  const statusText =
    document.getElementById("status");

  const videoArea =
    document.getElementById("videoArea");

  const localVideo =
    document.getElementById("localVideo");

  const remoteVideo =
    document.getElementById("remoteVideo");


  // ==========================================
  // WEBRTC
  // ==========================================

  let peerConnection = null;

  let localStream = null;

  let callRef = null;

  let remoteDescriptionSet = false;

  const receivedReceiverCandidates =
    new Set();


  const rtcConfig = {

    iceServers: [

      {
        urls:
          "stun:stun.l.google.com:19302"
      },

      {
        urls:
          "stun:stun1.l.google.com:19302"
      }

    ]

  };


  // ==========================================
  // FIREBASE LOGIN
  // ==========================================

  try {

    await signInAnonymously(auth);

    console.log(
      "Login Firebase berhasil"
    );

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "❌ Firebase gagal terhubung";

  }


  // ==========================================
  // TOMBOL PANGGIL
  // ==========================================

  panggilButton.addEventListener(
    "click",
    async () => {

      panggilButton.disabled = true;

      statusText.textContent =
        "🎥 Mengaktifkan kamera...";


      try {

        // ====================================
        // AKTIFKAN KAMERA + MICROPHONE
        // ====================================

        localStream =
          await navigator.mediaDevices
            .getUserMedia({

              video: true,

              audio: true

            });


        localVideo.srcObject =
          localStream;


        videoArea.style.display =
          "block";


        statusText.textContent =
          "📞 Membuat panggilan...";


        // ====================================
        // PEER CONNECTION
        // ====================================

        peerConnection =
          new RTCPeerConnection(
            rtcConfig
          );


        // ====================================
        // MASUKKAN KAMERA + MIC
        // ====================================

        localStream
          .getTracks()
          .forEach((track) => {

            peerConnection.addTrack(
              track,
              localStream
            );

          });


        // ====================================
        // TERIMA VIDEO DARI PENERIMA
        // ====================================

        peerConnection.ontrack =
          (event) => {

            console.log(
              "Video penerima diterima"
            );


            if (
              event.streams &&
              event.streams[0]
            ) {

              remoteVideo.srcObject =
                event.streams[0];

              statusText.textContent =
                "🟢 TERHUBUNG!";

            }

          };


        // ====================================
        // ICE DARI PENELPON
        // ====================================

        peerConnection.onicecandidate =
          async (event) => {

            if (
              event.candidate &&
              callRef
            ) {

              try {

                await updateDoc(

                  callRef,

                  {

                    callerCandidates:
                      arrayUnion(
                        event.candidate.toJSON()
                      )

                  }

                );

              } catch (error) {

                console.error(
                  "Gagal mengirim ICE:",
                  error
                );

              }

            }

          };


        // ====================================
        // BUAT OFFER
        // ====================================

        const offer =
          await peerConnection
            .createOffer();


        await peerConnection
          .setLocalDescription(
            offer
          );


        // ====================================
        // BUAT CALL DI FIRESTORE
        // ====================================

        callRef =
          await addDoc(

            collection(
              db,
              "calls"
            ),

            {

              callerId:
                auth.currentUser.uid,

              status:
                "menunggu",

              createdAtMs:
                Date.now(),

              waktu:
                serverTimestamp(),

              offer: {

                type:
                  offer.type,

                sdp:
                  offer.sdp

              },

              answer:
                null,

              callerCandidates:
                [],

              receiverCandidates:
                []

            }

          );


        console.log(
          "Call dibuat:",
          callRef.id
        );


        statusText.textContent =
          "📞 Menunggu penerima...";


        // ====================================
        // MENUNGGU ANSWER DARI PENERIMA
        // ====================================

        onSnapshot(

          callRef,

          async (snapshot) => {

            if (
              !snapshot.exists()
            ) {

              return;

            }


            const data =
              snapshot.data();


            // =================================
            // ANSWER SUDAH ADA
            // =================================

            if (
              data.answer &&
              data.answer.type &&
              data.answer.sdp &&
              !remoteDescriptionSet
            ) {

              try {

                console.log(
                  "Answer diterima"
                );


                await peerConnection
                  .setRemoteDescription(

                    new RTCSessionDescription(
                      data.answer
                    )

                  );


                remoteDescriptionSet =
                  true;


                statusText.textContent =
                  "🔄 Menghubungkan video...";


              } catch (error) {

                console.error(
                  "Gagal set answer:",
                  error
                );


                statusText.textContent =
                  "❌ Gagal menerima jawaban";

              }

            }


            // =================================
            // AMBIL ICE DARI PENERIMA
            // =================================

            const candidates =
              data.receiverCandidates ||
              [];


            for (
              const candidateData
              of candidates
            ) {

              try {

                const candidateKey =
                  JSON.stringify(
                    candidateData
                  );


                if (
                  receivedReceiverCandidates
                    .has(candidateKey)
                ) {

                  continue;

                }


                receivedReceiverCandidates
                  .add(candidateKey);


                if (
                  remoteDescriptionSet
                ) {

                  await peerConnection
                    .addIceCandidate(

                      new RTCIceCandidate(
                        candidateData
                      )

                    );

                }

              } catch (error) {

                console.error(
                  "Gagal menambahkan ICE penerima:",
                  error
                );

              }

            }


            // =================================
            // STATUS TERHUBUNG
            // =================================

            if (
              data.status ===
              "terhubung"
            ) {

              console.log(
                "Penerima sudah menerima panggilan"
              );

            }

          }

        );


      } catch (error) {

        console.error(
          "ERROR:",
          error
        );


        statusText.textContent =
          "❌ Gagal: " +
          error.message;


        panggilButton.disabled =
          false;

      }

    }

  );

</script>

</body>
</html>
