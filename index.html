 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW CALL</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0;
    }

    p {
      color: #666;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">🏠</div>

    <h1>AVEDOW CALL</h1>

    <p>Tekan tombol di bawah untuk melakukan panggilan.</p>

    <button onclick="panggil()">
      📹 PANGGIL
    </button>

    <div id="status">Menghubungkan...</div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDD0xBU25FCgEBs7eEtJhbCs_u8iSPISQw",
      authDomain: "avedow-call.firebaseapp.com",
      projectId: "avedow-call",
      storageBucket: "avedow-call.firebasestorage.app",
      messagingSenderId: "520287803907",
      appId: "1:520287803907:web:ecaa9a6b6ebf72e7d14c36",
      measurementId: "G-YJKPCCSL4G"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);

    let pengguna = null;


    try {

      const hasil = await signInAnonymously(auth);

      pengguna = hasil.user;

      document.getElementById("status").textContent =
        "✅ Terhubung";

    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "❌ Gagal terhubung ke Firebase";

    }


    window.panggil = async function() {

      if (!pengguna) {
        alert("Belum terhubung ke Firebase.");
        return;
      }

      try {

        await addDoc(collection(db, "calls"), {
          callerId: pengguna.uid,
          status: "menunggu",
          waktu: serverTimestamp()
        });

        document.getElementById("status").textContent =
          "📞 Permintaan panggilan dikirim";

        alert("📞 Panggilan dikirim!");

      } catch (error) {

        console.error(error);

        alert("Gagal mengirim panggilan.");

      }

    };

  </script>

</body>
</html>
